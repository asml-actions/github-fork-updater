name: Keep Scheduled Workflows Active

on:
  schedule:
    # Run every 30 days
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update keepalive file
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-run.txt

      - name: Commit changes
        run: |
          git config user.name "keep-me-alive-actions[bot]"
          git config user.email "keep-me-alive[bot]@users.noreply.github.com"

          git add .github/keepalive/last-run.txt

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: keep scheduled workflows active"
          git push
